name: 🐛 Bug Report / 问题反馈
description: 提交针对中继 Broker 运行、协议解析或鉴权机制的缺陷报告
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 缺陷描述 (Bug Description)
      description: 请清晰描述您在运行中遇到的问题或异常行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 重现步骤 (Steps to Reproduce)
      description: 提供能够重现问题的具体步骤或命令序列
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 运行环境 (Environment)
      description: Node.js / Python 版本, dsh 版本, 操作系统等信息
    validations:
      required: false
