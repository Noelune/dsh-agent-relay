# dsh-agent-relay broker configuration.
# Generated by: node setup/setup.js init   (or copy this file to config.yaml)
# NEVER commit config.yaml — it contains your shared secret.

broker:
  host: 127.0.0.1          # loopback by default; use 0.0.0.0 only behind TLS
  port: 19121
  secret: CHANGE_ME_RUN_SETUP_INIT
  rateLimitLoopback: 600   # relaxed on loopback
  rateLimitRemote: 120     # strict for non-loopback clients (remote mode)
  messageTtlDays: 7        # unread messages are kept this long
  persist: true            # persistence (survives restarts)
  storage: sqlite          # sqlite by default; set jsonl for legacy compatibility
  dataDir: ./data          # where relay.db (or messages.jsonl) lives
  leaseSeconds: 600        # v2 pull lease default
  maxAttempts: 3           # v2 delivery attempts before a request fails
  notifyFailedToSender: true  # send an "undelivered" reply when a request fails

security:
  lockAfterFailures: 5     # consecutive auth failures before locking
  lockMinutes: 5           # lock duration

# Optional v2 per-mode routing ACL. An agent with an entry may only send to
# the targets in its mode's whitelist; write is opt-in (empty = closed).
# Agents without an entry may send to anyone (v1-compatible default).
# agents:
#   alpha:
#     secret: <hex>                # per-agent secret (enables isolated auth)
#     allowed_read_targets: [beta]
#     allowed_continue_targets: [beta]
#     allowed_write_targets: []    # write closed unless granted

